services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: control-lavanderia:latest
    container_name: control-lavanderia-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LavanderiaConnection: Host=postgres;Port=5432;Database=control_lavanderia;Username=postgres;Password=postgres
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web

  postgres:
    image: postgres:17-alpine
    container_name: control-lavanderia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_lavanderia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_lavanderia"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
  web:
    external: true
    name: web
