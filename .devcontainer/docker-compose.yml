services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:9.0
    command: sleep infinity
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides appsettings.Development.json: inside the dev container the
      # database is reachable as "postgres", not "localhost".
      ConnectionStrings__LavanderiaConnection: "Host=postgres;Port=5432;Database=control_lavanderia_dev;Username=postgres;Password=root"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: control_lavanderia_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    # Published so host tools (pgAdmin, DBeaver, psql) can connect to
    # localhost:5432. Change to "5433:5432" if 5432 is taken on the host.
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_lavanderia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev

volumes:
  postgres_dev_data:

networks:
  dev:
    driver: bridge
